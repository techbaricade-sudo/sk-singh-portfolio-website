<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05060a" />
  <meta name="description" content="Something special is coming soon — Shivam Kumar Singh" />
  <title>Coming Soon — Shivam Kumar Singh</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05060a;
      --surface: #10131c;
      --surface-2: #171b26;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #52525b;
      --gold: #e7b34a;
      --gold-soft: rgba(231,179,74,0.12);
      --emerald: #10b981;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: 'Fraunces', Georgia, serif;
    }

    [data-theme="light"] {
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface-2: #f4f4f5;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(0,0,0,0.16);
      --text: #18181b;
      --text-muted: #52525b;
      --text-dim: #a1a1aa;
      --gold: #b8860b;
      --gold-soft: rgba(184,134,11,0.08);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.4s var(--ease), color 0.4s var(--ease);
      position: relative;
    }

    /* ===== AMBIENT BACKGROUND ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 700px 500px at 20% 15%, rgba(231,179,74,0.14), transparent 60%),
        radial-gradient(ellipse 600px 600px at 85% 85%, rgba(99,102,241,0.12), transparent 65%);
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      z-index: 0;
    }
    [data-theme="light"] body::after {
      background-image:
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    }

    /* ===== THEME TOGGLE ===== */
    .theme-toggle {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.3s var(--ease);
      backdrop-filter: blur(10px);
    }
    .theme-toggle:hover {
      border-color: var(--border-hover);
      transform: rotate(20deg);
    }

    /* ===== MAIN SHELL ===== */
    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
      animation: shellIn 1s var(--ease) both;
    }
    @keyframes shellIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== PROFILE PHOTO ===== */
    .avatar-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 32px;
      animation: avatarIn 1.2s var(--ease) 0.15s both;
    }
    @keyframes avatarIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Rotating conic ring */
    .avatar-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        var(--gold) 60deg,
        transparent 120deg,
        transparent 180deg,
        var(--gold) 240deg,
        transparent 300deg,
        transparent 360deg
      );
      animation: spin 8s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar-inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(231,179,74,0.15);
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: 50%;
      filter: saturate(1.05) contrast(1.02);
    }

    /* Status dot on avatar */
    .status-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--emerald);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 0 rgba(16,185,129,0.6);
      animation: pulseBadge 2s infinite;
    }
    @keyframes pulseBadge {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
    }

    /* ===== TEXT CONTENT ===== */
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 22px;
      animation: fadeUp 0.9s var(--ease) 0.3s both;
    }
    .kicker::before,
    .kicker::after {
      content: '';
      width: 24px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(40px, 7vw, 68px);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.035em;
      margin-bottom: 20px;
      animation: fadeUp 0.9s var(--ease) 0.4s both;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(135deg, #f0c76b 0%, var(--gold) 60%, #b8860b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .subtitle {
      font-size: 17px;
      color: var(--text-muted);
      max-width: 420px;
      margin: 0 auto 40px;
      line-height: 1.65;
      animation: fadeUp 0.9s var(--ease) 0.5s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== LOADING BAR ===== */
    .loading-wrap {
      max-width: 320px;
      margin: 0 auto 40px;
      animation: fadeUp 0.9s var(--ease) 0.6s both;
    }
    .loading-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .loading-label span:last-child { color: var(--gold); }
    .loading-track {
      width: 100%;
      height: 3px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loading-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), #f0c76b, var(--gold));
      border-radius: 999px;
      animation: fillUp 3s var(--ease) 1s forwards;
      box-shadow: 0 0 12px rgba(231,179,74,0.5);
    }
    @keyframes fillUp {
      from { width: 0%; }
      to { width: 72%; }
    }

    /* ===== SOCIAL ROW ===== */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
      animation: fadeUp 0.9s var(--ease) 0.7s both;
    }
    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      transition: all 0.35s var(--ease);
      text-decoration: none;
    }
    .social-btn:hover {
      background: var(--gold);
      color: #1a1408;
      border-color: var(--gold);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 28px rgba(231,179,74,0.3);
    }

    /* ===== FOOTER ===== */
    .footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
      animation: fadeUp 0.9s var(--ease) 0.8s both;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .footer .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .footer a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover { color: var(--gold); }

    /* ===== FLOATING PARTICLES ===== */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
      animation: floatParticle 20s infinite ease-in-out;
    }
    @keyframes floatParticle {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(30px, -40px); }
      50% { transform: translate(-20px, -80px); }
      75% { transform: translate(-40px, -30px); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .avatar-wrap { width: 120px; height: 120px; margin-bottom: 24px; }
      .theme-toggle { top: 16px; right: 16px; width: 38px; height: 38px; }
      .subtitle { font-size: 15px; padding: 0 8px; }
      h1 { margin-bottom: 16px; }
      .social-btn { width: 38px; height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>

  <!-- Floating particles -->
  <div class="particle" style="width:8px;height:8px;top:20%;left:12%;animation-delay:0s;"></div>
  <div class="particle" style="width:5px;height:5px;top:60%;left:88%;animation-delay:-5s;"></div>
  <div class="particle" style="width:6px;height:6px;top:80%;left:20%;animation-delay:-10s;"></div>
  <div class="particle" style="width:4px;height:4px;top:15%;left:75%;animation-delay:-15s;"></div>
  <div class="particle" style="width:7px;height:7px;top:45%;left:5%;animation-delay:-7s;"></div>

  <!-- Main -->
  <main class="shell">
    <!-- Profile Photo with Rotating Ring -->
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-inner">
        <img
          src="https://surveyheartmedia.s3.ap-south-1.amazonaws.com/files/c5147741a29f92f14076a39cd375d4/690f4a08860f444952205611/sh_1779037367579.png"
          alt="Shivam Kumar Singh"
        />
      </div>
      <div class="status-badge"></div>
    </div>

    <!-- Kicker -->
    <div class="kicker">Coming Soon</div>

    <!-- Headline -->
    <h1>
      We are just<br/>
      building <em>for you.</em>
    </h1>

    <!-- Subtitle -->
    <p class="subtitle">
      Something special is on its way. A brand new digital experience is being crafted with care — stay tuned.
    </p>

    <!-- Loading Bar -->
    <div class="loading-wrap">
      <div class="loading-label">
        <span>Development</span>
        <span id="progressText">0%</span>
      </div>
      <div class="loading-track">
        <div class="loading-fill"></div>
      </div>
    </div>

    <!-- Social -->
    <div class="social-row">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener" class="social-btn" aria-label="Facebook">f</a>
      <a href="https://www.instagram.com/sksingh_social" target="_blank" rel="noopener" class="social-btn" aria-label="Instagram">ig</a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener" class="social-btn" aria-label="YouTube">yt</a>
      <a href="https://x.com/sksingh_social" target="_blank" rel="noopener" class="social-btn" aria-label="X">𝕏</a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener" class="social-btn" aria-label="LinkedIn">in</a>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>© <span id="year"></span> Shivam Kumar Singh</span>
      <span class="dot"></span>
      <a href="mailto:sksingh.official@gmail.com">sksingh.official@gmail.com</a>
    </div>
  </main>

  <script>
    // Year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Theme toggle
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('sk_theme');
    if (savedTheme) html.setAttribute('data-theme', savedTheme);

    themeBtn.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('sk_theme', next);
    });

    // Animated percentage counter
    const progressText = document.getElementById('progressText');
    let count = 0;
    const target = 72;
    const duration = 3000;
    const stepTime = duration / target;

    function animateCount() {
      if (count < target) {
        count++;
        progressText.textContent = count + '%';
        setTimeout(animateCount, stepTime);
      }
    }
    setTimeout(animateCount, 1000);
  </script>
</body>
</html>
